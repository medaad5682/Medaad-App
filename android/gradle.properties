org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# ✅ Fix: R8 full mode breaks ffmpeg_kit_flutter_new_min's native JNI loading
# in release builds ("Bad JNI version returned from JNI_OnLoad" /
# UnsatisfiedLinkError on libffmpegkit_abidetect.so), even with -keep rules
# on the package. This is a long-documented issue across FFmpegKit-based
# Flutter plugins. Falling back to default (non-full) R8 mode resolves it.
android.enableR8.fullMode=false
