name: Build Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # ✅ 1. تسريع التحميل عبر الكاش (Gradle)
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # ✅ تفعيل كاش الفلاتر نفسه

      # ✅ 2. تسريع تحميل مكتبات Dart
      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # ✅ التعديل الحاسم هنا: حذف ملف القفل التالف قبل التثبيت
      - name: Clean and Get Packages
        run: |
          echo "Removing corrupted pubspec.lock..."
          rm -f pubspec.lock
          flutter clean
          flutter pub get

      - name: Generate App Icons
        run: flutter pub run flutter_launcher_icons
        
      - name: Create and Verify Keystore
        env:
          DATA: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          AGC_DATA: ${{ secrets.AGCONNECT_SERVICES_JSON_BASE64 }}
          KEYSTORE_DATA: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # التحقق من وجود الأسرار قبل فك التشفير لتجنب الأخطاء
          if [ -n "$DATA" ]; then
            echo "$DATA" | tr -d '[:space:]' | base64 -d > android/app/google-services.json
          fi

          # 🆕 HMS: ملف AppGallery Connect (مطلوب لإضافة com.huawei.agconnect، وبدونه يفشل البناء)
          if [ -n "$AGC_DATA" ]; then
            echo "$AGC_DATA" | tr -d '[:space:]' | base64 -d > android/app/agconnect-services.json
          else
            echo "::error::Secret AGCONNECT_SERVICES_JSON_BASE64 is missing. Add it in GitHub > Settings > Secrets and variables > Actions."
            exit 1
          fi
          
          if [ -n "$KEYSTORE_DATA" ]; then
            # ✅ التعديل لحل المشكلة: إنشاء مجلد keystore أولاً ثم وضع المفتاح بداخله
            mkdir -p android/app/keystore
            echo "$KEYSTORE_DATA" | tr -d '[:space:]' | base64 -d > android/app/keystore/upload-keystore.jks
          fi

      # ✅ 3. البناء الموحد (ملف واحد شامل للمعالجين)
      - name: Build Fat APK (Universal)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          # بناء APK واحد يحتوي على كل المعماريات
          flutter build apk --release --target-platform android-arm,android-arm64 --dart-define=APP_SECRET="$APP_SECRET" 

      # 🆕 فحص الـ APK بعد البناء: الأذونات، التوقيع، البصمات، ملف AppGallery.
      # النتيجة تظهر في سجل الخطوة وفي صفحة ملخص التشغيل (Summary) أعلى صفحة الـ workflow.
      # لا تطبع أي سر: كلمات المرور تُمرَّر عبر متغيرات بيئة فقط، والبصمات ليست أسراراً.
      # continue-on-error: فشل الفحص لا يمنع رفع الـ APK.
      - name: Inspect APK (permissions, signing, digests)
        continue-on-error: true
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          AAPT="$BT/aapt"
          APKSIGNER="$BT/apksigner"
          REPORT=$(find build -name "manifest-merger-release-report.txt" | head -1)

          {
            echo "## 📦 معلومات الحزمة"
            echo '```'
            "$AAPT" dump badging "$APK" | grep -E "^package:|^sdkVersion|^targetSdkVersion|^native-code" || true
            echo "حجم الملف: $(du -h "$APK" | cut -f1)"
            echo '```'

            echo "## 🔐 كل الأذونات داخل الـ APK"
            echo '```'
            "$AAPT" dump permissions "$APK" | grep "uses-permission" | sed -E "s/uses-permission(-sdk-23)?: name='([^']*)'.*/\2/" | sort -u
            echo '```'

            echo "## ⚠️ الأذونات الحساسة (لنموذج الخصوصية في AppGallery)"
            echo '```'
            "$AAPT" dump permissions "$APK" | grep "uses-permission" | sed -E "s/uses-permission(-sdk-23)?: name='([^']*)'.*/\2/" | sort -u \
              | grep -E "LOCATION|CAMERA|RECORD_AUDIO|CONTACTS|SMS|PHONE|CALL_|CALENDAR|BODY_SENSORS|READ_MEDIA|EXTERNAL_STORAGE|BLUETOOTH|WIFI|INSTALL_PACKAGES|SYSTEM_ALERT|QUERY_ALL_PACKAGES|AD_ID" \
              || echo "لا توجد أذونات حساسة من هذه القائمة"
            echo '```'

            echo "## 📍 من أضاف أذونات الموقع؟ (تقرير دمج المانيفست)"
            echo '```'
            if [ -n "$REPORT" ]; then
              grep -n -B1 -A6 "ACCESS_FINE_LOCATION\|ACCESS_COARSE_LOCATION\|ACCESS_BACKGROUND_LOCATION" "$REPORT" \
                || echo "لا توجد أذونات موقع في تقرير الدمج"
            else
              echo "لم يُعثر على manifest-merger-release-report.txt"
            fi
            echo '```'

            echo "## ✍️ توقيع الـ APK الحالي"
            echo '```'
            "$APKSIGNER" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256|SHA-1)"
            echo '```'

            CERT_HEX=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "certificate SHA-256 digest" | awk '{print $NF}')
            if [ -n "$CERT_HEX" ]; then
              CERT_COLON=$(echo "$CERT_HEX" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
              CERT_B64=$(python3 -c "import binascii,base64,sys; print(base64.b64encode(binascii.unhexlify(sys.argv[1])).decode())" "$CERT_HEX")
              echo "### بصمة الشهادة بالصيغ المطلوبة"
              echo '```'
              echo "HMS_ATTEST_ALLOWED_CERT_SHA256 / AppGallery : $CERT_COLON"
              echo "ما ستراه في payload هواوي (apkCertificateDigestSha256): $CERT_B64"
              echo '```'
            fi

            echo "## 🧾 بصمة ملف الـ APK نفسه (SHA-256)"
            APK_HEX=$(sha256sum "$APK" | awk '{print $1}')
            APK_B64=$(python3 -c "import binascii,base64,sys; print(base64.b64encode(binascii.unhexlify(sys.argv[1])).decode())" "$APK_HEX")
            echo '```'
            echo "hex   : $APK_HEX"
            echo "base64: $APK_B64   (يقابل apkDigestSha256 في payload هواوي، إن ثبّتّ هذا الملف نفسه دون إعادة توقيع)"
            echo '```'

            echo "## 🗝️ بصمة مفتاح الرفع (upload keystore)"
            echo '```'
            if [ -f android/app/keystore/upload-keystore.jks ] && [ -n "$KEY_ALIAS" ]; then
              keytool -list -v -keystore android/app/keystore/upload-keystore.jks -alias "$KEY_ALIAS" -storepass:env STORE_PASSWORD 2>&1 \
                | grep -E "Owner:|Valid from|SHA1:|SHA256:" || echo "تعذر قراءة المفتاح"
            else
              echo "لا يوجد keystore أو KEY_ALIAS غير مضبوط"
            fi
            echo '```'

            echo "## 🔗 ملف AppGallery Connect المستعمل في البناء"
            echo '```'
            python3 - <<'PY'
          import json
          try:
              c = json.load(open("android/app/agconnect-services.json")).get("client", {})
              print("package_name:", c.get("package_name"))
              print("app_id      :", c.get("app_id"))
          except Exception as e:
              print("تعذر قراءة agconnect-services.json:", e)
          PY
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # 🆕 تقرير دمج المانيفست كاملاً (يذكر مصدر كل إذن)
      - name: Upload manifest merger report
        uses: actions/upload-artifact@v4
        with:
          name: manifest-merger-report
          path: build/app/outputs/logs/manifest-merger-release-report.txt
          if-no-files-found: ignore
